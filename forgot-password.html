<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - CodeMentor</title>
  <meta name="description" content="Reset your CodeMentor password.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="auth-wrapper">
    <!-- Brand Header -->
    <header class="brand-header">
      <a href="index.html" class="brand-logo" aria-label="CodeMentor Home">
        <span class="brand-badge">&lt;/&gt;</span>
        <span>CodeMentor</span>
      </a>
      <p class="brand-tagline">Learn to solve. <span>Don't just get the answer.</span></p>
    </header>

    <!-- Forgot Password Card -->
    <main class="auth-card" id="authCard">
      <h1 class="auth-card-title">Forgot Password?</h1>
      <p class="auth-card-subtitle">
        Enter your email address and we will send you a password reset link.
      </p>

      <!-- Dynamic Alert Container -->
      <div id="alertContainer" role="alert" aria-live="assertive"></div>

      <!-- Reset Form -->
      <form id="forgotPasswordForm" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">Email address</label>
          <div class="input-container">
            <input 
              type="email" 
              id="email" 
              name="email" 
              class="form-input" 
              placeholder="developer@example.com" 
              autocomplete="email"
              required 
            />
          </div>
          <span class="form-helper" id="emailError"></span>
        </div>

        <button type="submit" id="resetBtn" class="btn btn-primary">
          Send Reset Link
        </button>
      </form>

      <!-- Footer Link -->
      <footer class="auth-card-footer">
        Remembered your password? <a href="login.html">Back to Login</a>
      </footer>
    </main>
  </div>

  <!-- Vanilla JavaScript Module -->
  <script type="module" src="js/forgot-password.js"></script>
</body>
</html>
